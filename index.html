<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biziverse Founder Workspace</title>
    <style>
        :root {
            --biz-navy: #0d2144;
            --biz-orange: #ff6d00; /* Vibrant Action Orange */
            --biz-blue: #1e88e5;
            --bg-grad: linear-gradient(135deg, #f4f7fa 0%, #e9eef5 100%);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-grad); 
            margin: 0; 
            padding: 20px;
            min-height: 100vh;
        }

        h1 { color: var(--biz-navy); text-align: center; text-transform: uppercase; letter-spacing: 2px; }

        /* The 3-Column Layout */
        .founder-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 30px;
            align-items: start;
        }

        .column {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 20px;
            min-height: 80vh;
            box-shadow: 0 8px 32px rgba(13, 33, 68, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .founder-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--biz-navy);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 4px solid var(--biz-orange);
            width: 100%;
            text-align: center;
        }

        .bubble-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        /* Creative Bubble Styling */
        .task-bubble {
            width: 95px;
            height: 95px;
            background: var(--biz-white);
            border: 2px solid var(--biz-navy);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            padding: 10px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
            background: white;
            color: var(--biz-navy);
        }

        .task-bubble:hover {
            transform: scale(1.1) rotate(5deg);
            border-color: var(--biz-orange);
            box-shadow: 0 10px 20px rgba(255, 109, 0, 0.2);
        }

        .task-tag {
            position: absolute;
            top: -5px;
            background: var(--biz-blue);
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 8px;
        }

        .add-btn {
            background: var(--biz-orange);
            color: white;
            border: none;
            font-size: 30px;
            box-shadow: 0 4px 15px rgba(255, 109, 0, 0.3);
        }

        .add-btn:hover {
            background: var(--biz-navy);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <h1>Biziverse Strategic Roadmap</h1>
    
    <div class="founder-grid">
        <div class="column" id="founder-1">
            <div class="founder-name">Co-Founder 1</div>
            <div class="bubble-container"></div>
        </div>

        <div class="column" id="founder-2">
            <div class="founder-name">Co-Founder 2</div>
            <div class="bubble-container"></div>
        </div>

        <div class="column" id="founder-3">
            <div class="founder-name">Co-Founder 3</div>
            <div class="bubble-container"></div>
        </div>
    </div>

    <script>
        // Initial Data with assignments
        const initialTasks = [
            { name: "IT/DPDP Terms", cat: "Legal", owner: "founder-1" },
            { name: "GST JSON", cat: "Legal", owner: "founder-1" },
            { name: "Fundraise Strategy", cat: "Finance", owner: "founder-2" },
            { cat: "Payment", name: "Yearly Pkg", owner: "founder-2" },
            { cat: "Server", name: "File Upload", owner: "founder-3" },
            { cat: "Server", name: "User Limits", owner: "founder-3" }
        ];

        function createBubble(task) {
            const b = document.createElement('div');
            b.className = 'task-bubble';
            b.innerHTML = `<div class="task-tag">${task.cat}</div><span>${task.name}</span>`;
            
            b.onclick = function() {
                const n = prompt("Edit Task Name:", task.name);
                if(n) { task.name = n; this.querySelector('span').innerText = n; }
            };
            return b;
        }

        function setupColumn(id) {
            const col = document.getElementById(id);
            const container = col.querySelector('.bubble-container');

            // Add initial tasks for this founder
            initialTasks.filter(t => t.owner === id).forEach(t => {
                container.appendChild(createBubble(t));
            });

            // Add "+" button
            const btn = document.createElement('div');
            btn.className = 'task-bubble add-btn';
            btn.innerText = '+';
            btn.onclick = () => {
                const name = prompt("New Task Name:");
                const cat = prompt("Category (A, B, C etc.):", "General");
                if(name) {
                    const newT = { name, cat, owner: id };
                    container.insertBefore(createBubble(newT), btn);
                }
            };
            container.appendChild(btn);
        }

        // Initialize all columns
        setupColumn('founder-1');
        setupColumn('founder-2');
        setupColumn('founder-3');
    </script>
</body>
</html>
