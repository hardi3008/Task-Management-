<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biziverse Project Master</title>
    <style>
        :root {
            --biz-navy: #0d2144;
            --biz-orange: #ff6d00;
            --biz-blue: #1e88e5;
            --bg: #f4f7fa;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--biz-navy); margin: 0; padding: 20px; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 3px solid var(--biz-navy); padding-bottom: 15px; }
        
        .today-btn { 
            background: var(--biz-orange); color: white; border: none; padding: 12px 24px; 
            border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255,109,0,0.3);
            transition: 0.3s;
        }
        .today-btn:hover { background: var(--biz-navy); transform: scale(1.05); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }

        .category-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .category-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; color: var(--biz-navy); border-left: 5px solid var(--biz-orange); padding-left: 10px; }

        .bubble-area { display: flex; flex-wrap: wrap; gap: 12px; }

        .task-bubble {
            background: white; border: 2px solid var(--biz-blue); border-radius: 50%;
            width: 95px; height: 95px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.2s; position: relative;
        }
        .task-bubble:hover { border-color: var(--biz-orange); transform: translateY(-3px); }

        .founder-tag {
            position: absolute; bottom: -8px; background: var(--biz-navy); color: white;
            padding: 2px 10px; border-radius: 12px; font-size: 9px; white-space: nowrap;
            border: 1px solid var(--biz-orange); transition: 0.3s;
        }
        .task-bubble:hover .founder-tag { background: var(--biz-orange); }

        /* Report Modal */
        #report-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 33, 68, 0.95); z-index: 1000; justify-content: center; align-items: center;
        }
        .report-content { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; color: var(--biz-navy); }
        .report-item { margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #f9f9f9; }
        .report-item h3 { color: var(--biz-orange); margin: 0 0 5px 0; border-bottom: 1px solid #ddd; }
        .close-report { float: right; cursor: pointer; color: var(--biz-orange); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-row">
        <h1>Biziverse Project Map</h1>
        <button class="today-btn" onclick="showTodayTasks()">📅 Today's Tasks</button>
    </div>
    
    <div class="grid-container" id="main-grid"></div>

    <div id="report-overlay">
        <div class="report-content">
            <span class="close-report" onclick="closeReport()">[CLOSE]</span>
            <h2>Founder Task List</h2>
            <div id="report-data"></div>
        </div>
    </div>

    <script>
        const founders = ["Founder 1", "Founder 2", "Founder 3"];

        const projectData = [
            { cat: "A. Low Server Impact", tasks: ["File upload", "Import Limits", "User limits"] },
            { cat: "B. Payment Process", tasks: ["Upgrade @ Everywhere", "Yearly packages", "Videos for features", "Paid user badge"] },
            { cat: "C. Self Start", tasks: ["Flow check", "Start anywhere", "Daily notifications", "Gmail Integration"] },
            { cat: "D. Infection", tasks: ["Utility message", "Retargeting ads", "Branding @ Docs", "Newsfeed"] },
            { cat: "E. Legal Protection", tasks: ["Terms (IT & DPDP)", "GST JSON", "B2B reporting", "Temp links"] }
        ];

        const grid = document.getElementById('main-grid');

        function createBubble(taskName, category) {
            const bubble = document.createElement('div');
            bubble.className = 'task-bubble';
            bubble.innerHTML = `<span>${taskName}</span><div class="founder-tag">Unassigned</div>`;
            
            // Logic: Clicking bubble only changes the Assignee
            bubble.onclick = function() {
                const choice = prompt("Assign to:\n1: Founder 1\n2: Founder 2\n3: Founder 3\n0: Reset to Unassigned");
                
                if (choice === "1") this.querySelector('.founder-tag').innerText = founders[0];
                else if (choice === "2") this.querySelector('.founder-tag').innerText = founders[1];
                else if (choice === "3") this.querySelector('.founder-tag').innerText = founders[2];
                else if (choice === "0") this.querySelector('.founder-tag').innerText = "Unassigned";
            };
            return bubble;
        }

        projectData.forEach(section => {
            const card = document.createElement('div');
            card.className = 'category-card';
            card.innerHTML = `<div class="category-title">${section.cat}</div>`;
            
            const area = document.createElement('div');
            area.className = 'bubble-area';

            section.tasks.forEach(taskName => {
                area.appendChild(createBubble(taskName, section.cat));
            });

            card.appendChild(area);
            grid.appendChild(card);
        });

        function showTodayTasks() {
            const reportData = document.getElementById('report-data');
            reportData.innerHTML = "";
            const bubbles = document.querySelectorAll('.task-bubble');
            
            let map = { "Founder 1": [], "Founder 2": [], "Founder 3": [], "Unassigned": [] };

            bubbles.forEach(b => {
                const name = b.querySelector('span').innerText;
                const founder = b.querySelector('.founder-tag').innerText;
                map[founder].push(name);
            });

            founders.forEach(f => {
                if(map[f].length > 0) {
                    const div = document.createElement('div');
                    div.className = 'report-item';
                    div.innerHTML = `<h3>${f}</h3>${map[f].join(', ')}`;
                    reportData.appendChild(div);
                }
            });

            document.getElementById('report-overlay').style.display = 'flex';
        }

        function closeReport() { document.getElementById('report-overlay').style.display = 'none'; }
    </script>
</body>
</html>
