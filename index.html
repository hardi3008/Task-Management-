<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Roadmap Overview</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; overflow: hidden; }
        #controls { position: absolute; top: 10px; left: 10px; z-index: 10; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .node circle { stroke: #fff; stroke-width: 1.5px; cursor: pointer; }
        .node text { pointer-events: none; text-anchor: middle; font-size: 10px; fill: #333; font-weight: 600; }
        .category-label { font-size: 14px; font-weight: bold; fill: #555; pointer-events: none; }
    </style>
</head>
<body>

    <div id="controls"><strong>Status:</strong> Drag bubbles to organize. Click to edit (Console).</div>
    <svg id="chart"></svg>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;

        const data = [
            { cat: "A. Server", name: "File Upload" }, { cat: "A. Server", name: "Import Limits" }, { cat: "A. Server", name: "User Limits" },
            { cat: "B. Payment", name: "Upgrades" }, { cat: "B. Payment", name: "Yearly Pkg" }, { cat: "B. Payment", name: "Videos" }, { cat: "B. Payment", name: "Paid Badge" },
            { cat: "C. Support", name: "Flow Check" }, { cat: "C. Support", name: "Mobile Start" }, { cat: "C. Support", name: "Notifications" }, { cat: "C. Support", name: "Gmail Int." },
            { cat: "D. Infection", name: "Doc Delivery" }, { cat: "D. Infection", name: "Retargeting" }, { cat: "D. Infection", name: "Branding" }, { cat: "D. Infection", name: "Newsfeed" },
            { cat: "E. Legal", name: "Terms" }, { cat: "E. Legal", name: "GST JSON" }, { cat: "E. Legal", name: "B2B Report" },
            { cat: "F. Fundraise", name: "Strategy" }, { cat: "F. Fundraise", name: "Meetings" },
            { cat: "G. Go-Live", name: "Free Pkg" }, { cat: "G. Go-Live", name: "Org Design" }, { cat: "G. Go-Live", name: "Trust Content" }
        ];

        const categories = [...new Set(data.map(d => d.cat))];
        const color = d3.scaleOrdinal().domain(categories).range(d3.schemeTableau10);

        const nodes = data.map((d, i) => ({
            ...d,
            radius: d.name.length * 2 + 30, // Size based on text length
            x: Math.random() * width,
            y: Math.random() * height
        }));

        const svg = d3.select("#chart")
            .attr("width", width)
            .attr("height", height);

        // Force Simulation to keep them grouped by category
        const simulation = d3.forceSimulation(nodes)
            .force("x", d3.forceX(d => (categories.indexOf(d.cat) % 4) * (width/4) + 150).strength(0.1))
            .force("y", d3.forceY(d => Math.floor(categories.indexOf(d.cat) / 4) * (height/2) + 150).strength(0.1))
            .force("collide", d3.forceCollide(d => d.radius + 2))
            .force("charge", d3.forceManyBody().strength(-10))
            .on("tick", ticked);

        const node = svg.selectAll(".node")
            .data(nodes)
            .enter().append("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("circle")
            .attr("r", d => d.radius)
            .style("fill", d => color(d.cat))
            .style("opacity", 0.8);

        node.append("text")
            .text(d => d.name)
            .attr("dy", ".3em");

        function ticked() {
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        }

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x; d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        // Simple click-to-edit rename
        node.on("click", function(event, d) {
            const newName = prompt("Rename task:", d.name);
            if (newName) {
                d.name = newName;
                d3.select(this).select("text").text(newName);
            }
        });

    </script>
</body>
</html>
