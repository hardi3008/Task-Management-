<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Task Dashboard</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        h1 { margin-bottom: 20px; color: #4285f4; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .category-card {
            background: var(--card);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #333;
            min-height: 250px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #4285f4;
            color: #fff;
        }

        .bubble-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .task-bubble {
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 11px;
            padding: 5px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .task-bubble:hover {
            transform: scale(1.1);
            background: #3d3d3d;
            border-color: #4285f4;
        }

        /* Styling for the Add Button */
        .add-btn {
            background: transparent;
            border: 2px dashed #4285f4;
            color: #4285f4;
            font-size: 24px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: rgba(66, 133, 244, 0.1);
        }

        .task-bubble span {
            word-wrap: break-word;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>Freemium Project: Bubble Chart</h1>
    
    <div class="grid-container" id="main-grid"></div>

    <script>
        const projectData = [
            { cat: "A. Low Server Impact", tasks: ["File upload", "Import Limits", "User limits"] },
            { cat: "B. Payment Process", tasks: ["Upgrade All", "Yearly Pkg", "Feature Videos", "Paid Badge"] },
            { cat: "C. Self Start", tasks: ["Flow check", "Mobile Start", "Daily Notif", "Gmail Int.", "Webinar"] },
            { cat: "D. Infection", tasks: ["Doc Delivery", "Ads/Pixels", "Newsfeed", "Webstore"] },
            { cat: "E. Legal Protection", tasks: ["IT/DPDP Terms", "GST JSON", "B2B Report", "Temp Links"] },
            { cat: "F. Fundraise", tasks: ["Strategy", "Meetings"] },
            { cat: "G. Go-Live", tasks: ["Free Pkg", "Org Design", "2.5L Teaser", "Trust Content"] }
        ];

        const grid = document.getElementById('main-grid');

        // Function to create a task bubble with edit functionality
        function createBubble(taskName) {
            const bubble = document.createElement('div');
            bubble.className = 'task-bubble';
            bubble.innerHTML = `<span>${taskName}</span>`;
            
            bubble.onclick = function() {
                const currentName = this.querySelector('span').innerText;
                const editName = prompt("Edit task name:", currentName);
                if (editName) this.querySelector('span').innerText = editName;
            };
            return bubble;
        }

        projectData.forEach(section => {
            const card = document.createElement('div');
            card.className = 'category-card';

            const title = document.createElement('div');
            title.className = 'category-title';
            title.innerText = section.cat;
            card.appendChild(title);

            const area = document.createElement('div');
            area.className = 'bubble-area';

            // Add existing sub-tasks
            section.tasks.forEach(taskName => {
                area.appendChild(createBubble(taskName));
            });

            // Add the "+" button bubble
            const addBtn = document.createElement('div');
            addBtn.className = 'task-bubble add-btn';
            addBtn.innerText = '+';

            addBtn.onclick = function() {
                const newTask = prompt("Enter new sub-task name:");
                if (newTask) {
                    const newBubble = createBubble(newTask);
                    area.insertBefore(newBubble, addBtn); // Adds bubble before the button
                }
            };

            area.appendChild(addBtn);
            card.appendChild(area);
            grid.appendChild(card);
        });
    </script>
</body>
</html>
