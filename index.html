<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Bubble Workspace</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 0; overflow: hidden; }
        #header { position: absolute; top: 20px; left: 20px; z-index: 100; pointer-events: none; }
        svg { width: 100vw; height: 100vh; background: #1a1a1a; display: block; }
        .node circle { stroke: #fff; stroke-width: 2px; cursor: grab; }
        .node text { pointer-events: none; text-anchor: middle; font-size: 12px; fill: white; font-weight: bold; }
    </style>
</head>
<body>

    <div id="header">
        <h1>Project Overview</h1>
        <p>Drag bubbles to organize • Click to rename</p>
    </div>

    <svg id="canvas"></svg>

    <script>
        // Ensure script runs after page load
        window.onload = function() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            const data = [
                { cat: "A", name: "File Upload" }, { cat: "A", name: "Import Limits" }, { cat: "A", name: "User Limits" },
                { cat: "B", name: "Upgrades" }, { cat: "B", name: "Yearly Pkg" }, { cat: "B", name: "Videos" },
                { cat: "C", name: "Flow Check" }, { cat: "C", name: "Mobile Start" }, { cat: "C", name: "Gmail Int." },
                { cat: "D", name: "Doc Delivery" }, { cat: "D", name: "Retargeting" }, { cat: "D", name: "Newsfeed" },
                { cat: "E", name: "Terms" }, { cat: "E", name: "GST JSON" }, { cat: "E", name: "B2B Report" },
                { cat: "F", name: "Strategy" }, { cat: "F", name: "Meetings" },
                { cat: "G", name: "Free Pkg" }, { cat: "G", name: "Org Design" }
            ];

            const color = d3.scaleOrdinal(d3.schemeCategory10);

            const nodes = data.map(d => ({
                ...d,
                radius: 50,
                x: Math.random() * width,
                y: Math.random() * height
            }));

            const svg = d3.select("#canvas");

            const simulation = d3.forceSimulation(nodes)
                .force("charge", d3.forceManyBody().strength(-100))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(55))
                .on("tick", ticked);

            const node = svg.selectAll(".node")
                .data(nodes)
                .enter().append("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
                    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

            node.append("circle")
                .attr("r", 50)
                .style("fill", d => color(d.cat));

            node.append("text")
                .text(d => d.name)
                .attr("dy", ".3em");

            function ticked() {
                node.attr("transform", d => `translate(${d.x},${d.y})`);
            }

            node.on("click", function(event, d) {
                const n = prompt("Rename:", d.name);
                if (n) { d.name = n; d3.select(this).select("text").text(n); }
            });
        };
    </script>
</body>
</html>
