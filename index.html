<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biziverse Project Dashboard</title>
    <style>
        /* Biziverse Inspired Color Palette */
        :root {
            --biz-navy: #0d2144;      /* Deep Navy */
            --biz-blue: #1e88e5;      /* Primary Bright Blue */
            --biz-light-bg: #f4f7fa;  /* Light Background */
            --biz-white: #ffffff;
            --biz-gray: #607d8b;
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--biz-light-bg); 
            color: var(--biz-navy); 
            margin: 0; 
            padding: 20px; 
        }
        
        header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--biz-blue);
            padding-bottom: 10px;
        }

        h1 { 
            margin: 0; 
            font-size: 24px; 
            color: var(--biz-navy);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .category-card {
            background: var(--biz-white);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(13, 33, 68, 0.08);
            border-top: 5px solid var(--biz-navy);
            transition: transform 0.2s;
        }

        .category-card:hover {
            transform: translateY(-5px);
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--biz-navy);
            display: flex;
            justify-content: space-between;
        }

        .bubble-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-start;
        }

        /* Bubble Styling */
        .task-bubble {
            background: var(--biz-white);
            border: 2px solid var(--biz-blue);
            color: var(--biz-navy);
            border-radius: 50%;
            width: 85px;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(30, 136, 229, 0.2);
            line-height: 1.2;
        }

        .task-bubble:hover {
            background: var(--biz-blue);
            color: white;
            box-shadow: 0 5px 15px rgba(30, 136, 229, 0.4);
            transform: scale(1.05);
        }

        /* Add Button Specific Style */
        .add-btn {
            background: #e3f2fd;
            border: 2px dashed var(--biz-blue);
            color: var(--biz-blue);
            font-size: 28px;
        }

        .add-btn:hover {
            background: var(--biz-blue);
            color: white;
            border-style: solid;
        }

        .task-bubble span {
            word-wrap: break-word;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Biziverse Project Tracker</h1>
    </header>
    
    <div class="grid-container" id="main-grid"></div>

    <script>
        const projectData = [
            { cat: "A. Low Server Impact", tasks: ["File upload", "Import Limits", "User limits"] },
            { cat: "B. Payment Process", tasks: ["Upgrade All", "Yearly Pkg", "Videos", "Paid Badge"] },
            { cat: "C. Self Start", tasks: ["Flow check", "Mobile", "Daily Notif", "Gmail Int."] },
            { cat: "D. Infection", tasks: ["Doc Delivery", "Ads/Pixels", "Newsfeed", "Webstore"] },
            { cat: "E. Legal Protection", tasks: ["IT/DPDP", "GST JSON", "B2B Report"] },
            { cat: "F. Fundraise", tasks: ["Strategy", "Meetings"] },
            { cat: "G. Go-Live", tasks: ["Free Pkg", "Org Design", "2.5L Teaser"] }
        ];

        const grid = document.getElementById('main-grid');

        function createBubble(taskName) {
            const bubble = document.createElement('div');
            bubble.className = 'task-bubble';
            bubble.innerHTML = `<span>${taskName}</span>`;
            
            bubble.onclick = function() {
                const currentName = this.querySelector('span').innerText;
                const editName = prompt("Edit task name:", currentName);
                if (editName) this.querySelector('span').innerText = editName;
            };
            return bubble;
        }

        projectData.forEach(section => {
            const card = document.createElement('div');
            card.className = 'category-card';

            const title = document.createElement('div');
            title.className = 'category-title';
            title.innerText = section.cat;
            card.appendChild(title);

            const area = document.createElement('div');
            area.className = 'bubble-area';

            section.tasks.forEach(taskName => {
                area.appendChild(createBubble(taskName));
            });

            const addBtn = document.createElement('div');
            addBtn.className = 'task-bubble add-btn';
            addBtn.innerText = '+';

            addBtn.onclick = function() {
                const newTask = prompt("Enter new task name:");
                if (newTask) {
                    const newBubble = createBubble(newTask);
                    area.insertBefore(newBubble, addBtn);
                }
            };

            area.appendChild(addBtn);
            card.appendChild(area);
            grid.appendChild(card);
        });
    </script>
</body>
</html>
