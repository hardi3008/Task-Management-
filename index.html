<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biziverse Project Master</title>
    <style>
        :root {
            --biz-navy: #0d2144;
            --biz-orange: #ff6d00;
            --biz-blue: #1e88e5;
            --bg: #f4f7fa;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--biz-navy); margin: 0; padding: 20px; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 3px solid var(--biz-navy); padding-bottom: 15px; }
        
        .today-btn { 
            background: var(--biz-orange); color: white; border: none; padding: 12px 24px; 
            border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255,109,0,0.3);
            transition: 0.3s;
        }
        .today-btn:hover { background: var(--biz-navy); transform: scale(1.05); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }

        .category-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 200px; }
        .category-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; color: var(--biz-navy); border-left: 5px solid var(--biz-orange); padding-left: 10px; }

        .bubble-area { display: flex; flex-wrap: wrap; gap: 15px; }

        .task-bubble {
            background: white; border: 2px solid var(--biz-blue); border-radius: 50%;
            width: 95px; height: 95px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            font-size: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; position: relative;
        }
        .task-bubble:hover { border-color: var(--biz-orange); transform: translateY(-3px); }

        .founder-tag {
            position: absolute; bottom: -8px; background: var(--biz-navy); color: white;
            padding: 2px 10px; border-radius: 12px; font-size: 9px; white-space: nowrap;
            border: 1px solid var(--biz-orange);
        }

        .add-btn { border: 2px dashed #999; color: #999; font-size: 28px; }
        .add-btn:hover { color: var(--biz-orange); border-color: var(--biz-orange); }

        /* Report Modal */
        #report-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 33, 68, 0.95); z-index: 1000; justify-content: center; align-items: center;
        }
        .report-content { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; color: var(--biz-navy); max-height: 80vh; overflow-y: auto; }
        .report-item { margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #f9f9f9; border-left: 4px solid var(--biz-orange); }
        .report-item h3 { color: var(--biz-navy); margin: 0 0 5px 0; font-size: 1.2rem; }
        .close-report { float: right; cursor: pointer; color: var(--biz-orange); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-row">
        <h1>Biziverse Project Map</h1>
        <button class="today-btn" onclick="showTodayTasks()">📅 Today's Tasks</button>
    </div>
    
    <div class="grid-container" id="main-grid"></div>

    <div id="report-overlay">
        <div class="report-content">
            <span class="close-report" onclick="closeReport()">[CLOSE]</span>
            <h2>Assignment Summary</h2>
            <div id="report-data"></div>
        </div>
    </div>

    <script>
        const projectData = [
            { cat: "A. Low Server Impact", tasks: ["File upload", "Import Limits", "User limits"] },
            { cat: "B. Payment Process", tasks: ["Upgrade @ Everywhere", "Yearly packages", "Videos for features"] },
            { cat: "C. Self Start", tasks: ["Flow check", "Start anywhere", "Daily notifications"] },
            { cat: "D. Infection", tasks: ["Utility message", "Retargeting ads", "Newsfeed"] },
            { cat: "E. Legal Protection", tasks: ["Terms (IT & DPDP)", "GST JSON", "B2B reporting"] }
        ];

        const grid = document.getElementById('main-grid');

        // Function to create bubble with all features
        function createBubble(taskName) {
            const bubble = document.createElement('div');
            bubble.className = 'task-bubble';
            bubble.innerHTML = `<span>${taskName}</span><div class="founder-tag">Unassigned</div>`;
            
            bubble.onclick = function() {
                const choice = prompt("Type '1' to Rename Task\nType '2' to Assign Person/Name");
                
                if (choice === "1") {
                    const newName = prompt("Enter new task name:", this.querySelector('span').innerText);
                    if (newName) this.querySelector('span').innerText = newName;
                } else if (choice === "2") {
                    const person = prompt("Enter Name to Assign:");
                    if (person) this.querySelector('.founder-tag').innerText = person;
                }
            };
            return bubble;
        }

        // Initialize Grid
        projectData.forEach(section => {
            const card = document.createElement('div');
            card.className = 'category-card';
            card.innerHTML = `<div class="category-title">${section.cat}</div>`;
            
            const area = document.createElement('div');
            area.className = 'bubble-area';

            // Add initial tasks
            section.tasks.forEach(t => area.appendChild(createBubble(t)));

            // Add the "+" Button
            const addBtn = document.createElement('div');
            addBtn.className = 'task-bubble add-btn';
            addBtn.innerText = '+';
            addBtn.onclick = function() {
                const newTaskName = prompt("Enter new sub-task name:");
                if (newTaskName) {
                    area.insertBefore(createBubble(newTaskName), addBtn);
                }
            };

            area.appendChild(addBtn);
            card.appendChild(area);
            grid.appendChild(card);
        });

        function showTodayTasks() {
            const reportData = document.getElementById('report-data');
            reportData.innerHTML = "";
            const bubbles = document.querySelectorAll('.task-bubble:not(.add-btn)');
            
            let map = {};

            bubbles.forEach(b => {
                const name = b.querySelector('span').innerText;
                const person = b.querySelector('.founder-tag').innerText;
                if (!map[person]) map[person] = [];
                map[person].push(name);
            });

            for (let person in map) {
                const div = document.createElement('div');
                div.className = 'report-item';
                div.innerHTML = `<h3>${person}</h3><p>${map[person].join(', ')}</p>`;
                reportData.appendChild(div);
            }

            document.getElementById('report-overlay').style.display = 'flex';
        }

        function closeReport() { document.getElementById('report-overlay').style.display = 'none'; }
    </script>
</body>
</html>
