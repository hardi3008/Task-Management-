<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biziverse Project Master</title>
    <style>
        :root {
            --biz-navy: #0d2144;
            --biz-orange: #ff6d00;
            --biz-blue: #1e88e5;
            --bg: #f4f7fa;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--biz-navy); margin: 0; padding: 20px; }
        
        h1 { border-left: 8px solid var(--biz-orange); padding-left: 15px; margin-bottom: 30px; text-transform: uppercase; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .category-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(13, 33, 68, 0.1);
            border-top: 4px solid var(--biz-navy);
        }

        .category-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--biz-navy);
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .bubble-area {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .task-bubble {
            background: white;
            border: 2px solid var(--biz-blue);
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .task-bubble:hover {
            border-color: var(--biz-orange);
            transform: translateY(-5px);
        }

        /* Founder Assignment Tag */
        .founder-tag {
            position: absolute;
            bottom: -5px;
            background: var(--biz-navy);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 9px;
            border: 1px solid var(--biz-orange);
        }

        .add-btn {
            border: 2px dashed var(--biz-orange);
            color: var(--biz-orange);
            font-size: 30px;
        }

        .add-btn:hover { background: #fff3e0; }
    </style>
</head>
<body>

    <h1>Biziverse Roadmap & Assignment</h1>
    
    <div class="grid-container" id="main-grid"></div>

    <script>
        // Founders list
        const founders = ["Founder 1", "Founder 2", "Founder 3"];

        const projectData = [
            { cat: "A. Low Server Impact", tasks: ["File upload", "Import Limits", "User limits"] },
            { cat: "B. Payment Process", tasks: ["Upgrade All", "Yearly Pkg", "Paid Badge"] },
            { cat: "C. Self Start", tasks: ["Flow check", "Mobile", "Gmail Int."] },
            { cat: "D. Infection", tasks: ["Doc Delivery", "Ads/Pixels", "Webstore"] },
            { cat: "E. Legal Protection", tasks: ["IT/DPDP", "GST JSON", "B2B Report"] }
        ];

        const grid = document.getElementById('main-grid');

        function createBubble(taskName, assignedFounder = "Unassigned") {
            const bubble = document.createElement('div');
            bubble.className = 'task-bubble';
            bubble.innerHTML = `<span>${taskName}</span><div class="founder-tag">${assignedFounder}</div>`;
            
            bubble.onclick = function() {
                const action = confirm("Click OK to Rename, Cancel to Change Assignee");
                if (action) {
                    const newName = prompt("New task name:", taskName);
                    if (newName) this.querySelector('span').innerText = newName;
                } else {
                    const fIndex = prompt("Assign to: 0: Founder 1, 1: Founder 2, 2: Founder 3");
                    if (fIndex !== null && founders[fIndex]) {
                        this.querySelector('.founder-tag').innerText = founders[fIndex];
                    }
                }
            };
            return bubble;
        }

        projectData.forEach(section => {
            const card = document.createElement('div');
            card.className = 'category-card';

            const title = document.createElement('div');
            title.className = 'category-title';
            title.innerText = section.cat;
            card.appendChild(title);

            const area = document.createElement('div');
            area.className = 'bubble-area';

            section.tasks.forEach(taskName => {
                area.appendChild(createBubble(taskName));
            });

            // Add task button
            const addBtn = document.createElement('div');
            addBtn.className = 'task-bubble add-btn';
            addBtn.innerText = '+';

            addBtn.onclick = function() {
                const newTask = prompt("Enter new task name:");
                if (newTask) {
                    area.insertBefore(createBubble(newTask), addBtn);
                }
            };

            area.appendChild(addBtn);
            card.appendChild(area);
            grid.appendChild(card);
        });
    </script>
</body>
</html>
